[project]
name = "knowurdb-mdb-backend"
version = "2.0.0"
description = "knowUrDB (m.DB) — MongoDB-First Natural Language Database & Multi-Source Intelligence Platform"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
