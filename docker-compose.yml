services:
  knowurdb-mongodb:
    image: mongo:8.0
    container_name: knowurdb-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: knowurdb
    volumes:
      - knowurdb_mongodb_data:/data/db
      - knowurdb_mongodb_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  knowurdb_mongodb_data:
    name: knowurdb_mongodb_data
  knowurdb_mongodb_config:
    name: knowurdb_mongodb_config
